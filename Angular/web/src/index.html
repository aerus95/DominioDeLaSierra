<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <base href="/">
    <title>Dominio de la Sierra · Vinos de Rufete</title>
    <meta name="description" content="Vinos de altura, visitas y experiencias en San Esteban de la Sierra.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      #welcome-loader{position:fixed;inset:0;z-index:1000;overflow:hidden;background:#251319;color:#faf7f1;transform:translateY(0);transition:transform .78s cubic-bezier(.76,0,.24,1);font-family:Georgia,serif}
      #welcome-loader.leaving{transform:translateY(-100%);pointer-events:none}
      .welcome-photo{position:absolute;inset:0 46% 0 0;background:linear-gradient(90deg,#1d10124d,#25131922),url('/assets/brand/visit-experience-web.jpg') 58% center/cover;transform:scale(1.025);animation:loader-camera 6s ease-out both;transition:transform 1s ease}
      .welcome-panel{position:absolute;inset:0 0 0 51%;background:linear-gradient(135deg,#2b171e,#1f1116);box-shadow:-50px 0 100px #160b1066}
      .welcome-panel:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 75% 18%,#d5ad7620,transparent 28%),repeating-linear-gradient(90deg,transparent 0 79px,#ffffff05 80px)}
      .welcome-vine{position:absolute;z-index:1;right:-6%;top:-9%;width:min(48vw,700px);height:min(50vw,600px);background:url('/assets/brand/rufete-vine-web.png') center/contain no-repeat;opacity:.22;transform:rotate(16deg)}
      .welcome-inner{position:absolute;z-index:2;left:55%;right:7%;top:50%;transform:translateY(-50%);max-width:590px;text-align:left}
      .welcome-brand{display:flex;align-items:center;gap:20px;margin-bottom:clamp(45px,8vh,90px)}
      .welcome-kicker{font:600 10px/1.5 system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#d9b784;margin:0}
      .welcome-seal{display:grid;place-items:center;width:64px;height:64px;flex:0 0 auto;border:1px solid #d3ad76;border-radius:50%;font-size:20px;letter-spacing:2px;color:#e2c59d;box-shadow:0 0 0 7px #d8bd9709}
      .welcome-title{font-size:clamp(46px,5.2vw,88px);line-height:.92;margin:0 0 24px;font-weight:400;letter-spacing:-.045em}
      .welcome-title em{display:block;color:#dfc095;font-weight:400}
      .welcome-caption{font:14px/1.75 system-ui,sans-serif;color:#d7cbd0;margin:0;max-width:380px}
      .welcome-progress{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:18px;margin-top:38px;max-width:400px}
      .welcome-progress span{font:600 9px/1 system-ui,sans-serif;letter-spacing:.18em;color:#d8bd97}
      .welcome-track{height:1px;overflow:hidden;background:#ffffff25}
      .welcome-track:after{content:'';display:block;width:38%;height:100%;background:#d8bd97;animation:welcome-progress 1.35s cubic-bezier(.65,0,.35,1) infinite}
      .welcome-count{position:absolute;left:4%;bottom:4%;z-index:2;font:600 9px/1 system-ui,sans-serif;letter-spacing:.22em;color:#ffffffb5;text-transform:uppercase}
      #welcome-retry{display:none;color:#fff;font:14px system-ui,sans-serif;text-underline-offset:5px;padding:12px}
      #welcome-loader.failed #welcome-retry{display:inline-block}
      #welcome-loader.failed .welcome-track{display:none}
      @keyframes welcome-progress{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
      @keyframes loader-camera{from{transform:scale(1.08)}to{transform:scale(1.025)}}
      @media(max-width:760px){.welcome-photo{inset:0;background-image:linear-gradient(180deg,#1d10125c,#241218f2 70%),url('/assets/brand/visit-experience-web.jpg');background-position:64% center}.welcome-panel{inset:43% 0 0;background:linear-gradient(transparent,#241218 20%)}.welcome-vine{width:110vw;height:70vh;right:-45%;top:-20%;opacity:.15}.welcome-inner{left:24px;right:24px;top:auto;bottom:9%;transform:none}.welcome-brand{margin-bottom:34px}.welcome-title{font-size:clamp(45px,14vw,66px)}.welcome-caption{font-size:13px;max-width:310px}.welcome-progress{margin-top:26px}.welcome-count{display:none}}
      @media(prefers-reduced-motion:reduce){#welcome-loader{transition:none}.welcome-track:after{animation:none;width:100%}.welcome-photo{animation:none}}
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  </head>
  <body>
    <div id="welcome-loader" role="status" aria-live="polite" aria-label="Cargando Dominio de la Sierra">
      <div class="welcome-photo" aria-hidden="true"></div>
      <div class="welcome-panel" aria-hidden="true"></div>
      <div class="welcome-vine" aria-hidden="true"></div>
      <div class="welcome-inner">
        <div class="welcome-brand"><div class="welcome-seal" aria-hidden="true">DS</div><p class="welcome-kicker">San Esteban de la Sierra<br>Salamanca · España</p></div>
        <p class="welcome-title">Dominio <em>de la Sierra</em></p>
        <p class="welcome-caption" id="welcome-caption">Abrimos la bodega. La Rufete, el paisaje y una copa están a punto de encontrarse.</p>
        <div class="welcome-progress" aria-hidden="true"><span>ENTRANDO</span><div class="welcome-track"></div></div>
        <a id="welcome-retry" href="">Volver a cargar</a>
        <noscript><p>Activa JavaScript en tu navegador para visitar la web.</p></noscript>
      </div>
      <span class="welcome-count">Rufete · Altitud · Tiempo</span>
    </div>
    <ds-root inert aria-busy="true"></ds-root>
    <script>
      // Also covers failures that occur before the application bundle executes.
      window.dsLoadingTimeout = setTimeout(function () {
        var loader = document.getElementById('welcome-loader');
        if (loader && !loader.classList.contains('leaving')) {
          loader.classList.add('failed');
          document.getElementById('welcome-caption').textContent = 'La conexión está tardando más de lo habitual. Puedes volver a intentarlo.';
        }
      }, 15000);
    </script>
  </body>
</html>
