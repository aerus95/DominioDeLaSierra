# Bandeja local de Dominio de la Sierra. No forma parte del compose de PostgreSQL:
# docker compose -f docker-compose.mailpit.yml up -d
# Bandeja: http://127.0.0.1:8025
# SMTP: 127.0.0.1:1025
# No define MP_SMTP_RELAY_*: Mailpit guarda los mensajes y no los reenvía.
services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: dominio-sierra-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
